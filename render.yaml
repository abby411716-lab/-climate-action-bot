databases:
  - name: climate-action-db
    plan: free

services:
  - type: web
    name: climate-action-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LIFF_ID
        value: "2011196878-AqSPG56m"
      - key: CARBON_LIFF_ID
        value: "2011280445-r8e78Taj"
      - key: DATABASE_URL
        fromDatabase:
          name: climate-action-db
          property: connectionString
