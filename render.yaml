services:
  - type: web
    name: climate-action-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: LIFF_ID
        value: "2011196878-AqSPG56m"
      - key: CARBON_LIFF_ID
        value: "2011280445-r8e78Taj"
      # 資料庫改用 Neon（Render 免費 Postgres 30 天會過期），連線網址在 Render 後台 Environment 手動設定
      - key: DATABASE_URL
        sync: false
